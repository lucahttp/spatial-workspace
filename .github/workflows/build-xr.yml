name: Build Native XR (PICO, Quest, visionOS)

on:
  push:
    branches:
      - main
      - feat/godot-native-xr
    tags:
      - 'v*'
    paths:
      - 'godot-spatial-workspace/**'
      - '.github/workflows/build-xr.yml'
  pull_request:
    branches:
      - main
      - feat/godot-native-xr
    paths:
      - 'godot-spatial-workspace/**'
      - '.github/workflows/build-xr.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target headset to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pico
          - quest
          - visionos
      release_tag:
        description: 'Release tag (default: latest, or e.g. v0.1.0)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE_TAG: "4.7.2-stable"

jobs:
  # =========================================================================
  # 1. PICO 4 Ultra APK
  # =========================================================================
  build-pico:
    name: Build PICO 4 Ultra APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'pico' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "Using Android SDK at $ANDROID_PATH"

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot Engine & Export Templates
        run: |
          echo "=== Downloading Godot Engine ${{ env.GODOT_RELEASE_TAG }} ==="
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${{ env.GODOT_RELEASE_TAG }}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm godot.zip

          echo "=== Downloading Export Templates ==="
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz
          
          for DIR_NAME in "${{ env.GODOT_VERSION }}.stable" "${{ env.GODOT_RELEASE_TAG }}"; do
            TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${DIR_NAME}"
            mkdir -p "$TEMPLATE_DIR"
            cp -r templates/* "$TEMPLATE_DIR/"
          done
          rm -rf templates templates.tpz

      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          printf '[godot_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_PATH" "$HOME" > ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Export PICO 4 Ultra APK
        run: |
          mkdir -p godot-spatial-workspace/builds/pico
          cd godot-spatial-workspace
          godot --headless --import || true
          godot --headless --verbose --export-debug "PICO 4 Ultra" builds/pico/SpatialWorkspace-Pico4Ultra.apk

      - name: Upload PICO 4 Ultra APK
        uses: actions/upload-artifact@v4
        with:
          name: pico4-ultra-apk
          path: godot-spatial-workspace/builds/pico/*.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 2. Meta Quest APK
  # =========================================================================
  build-quest:
    name: Build Meta Quest APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'quest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "Using Android SDK at $ANDROID_PATH"

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot Engine & Export Templates
        run: |
          echo "=== Downloading Godot Engine ${{ env.GODOT_RELEASE_TAG }} ==="
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${{ env.GODOT_RELEASE_TAG }}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm godot.zip

          echo "=== Downloading Export Templates ==="
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz
          
          for DIR_NAME in "${{ env.GODOT_VERSION }}.stable" "${{ env.GODOT_RELEASE_TAG }}"; do
            TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${DIR_NAME}"
            mkdir -p "$TEMPLATE_DIR"
            cp -r templates/* "$TEMPLATE_DIR/"
          done
          rm -rf templates templates.tpz

      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          printf '[godot_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_PATH" "$HOME" > ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Export Meta Quest APK
        run: |
          mkdir -p godot-spatial-workspace/builds/quest
          cd godot-spatial-workspace
          godot --headless --import || true
          godot --headless --verbose --export-debug "Meta Quest" builds/quest/SpatialWorkspace-MetaQuest.apk

      - name: Upload Meta Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: meta-quest-apk
          path: godot-spatial-workspace/builds/quest/*.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 3. Apple Vision Pro (visionOS Xcode Project)
  # =========================================================================
  build-visionos:
    name: Build Apple Vision Pro (visionOS)
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'visionos' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Godot Engine & Export Templates (macOS)
        run: |
          echo "=== Downloading Godot Engine ${{ env.GODOT_RELEASE_TAG }} (macOS) ==="
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_macos.universal.zip" -o godot_macos.zip
          unzip -q godot_macos.zip
          sudo mv Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          rm godot_macos.zip

          echo "=== Downloading Export Templates ==="
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz

          echo "=== Extracted templates list ==="
          ls -la templates/

          # Prepare visionos.zip once from ios.zip by mapping xcframework bindings
          if [ -f "templates/ios.zip" ]; then
            echo "Creating visionos.zip template with visionos xcframework bindings..."
            rm -rf /tmp/visionos_template
            mkdir -p /tmp/visionos_template
            unzip -q templates/ios.zip -d /tmp/visionos_template
            
            pushd /tmp/visionos_template > /dev/null
            for F in libgodot.ios.*; do
              if [ -e "$F" ]; then
                NEW_F=$(echo "$F" | sed 's/libgodot\.ios\./libgodot.visionos./')
                echo "Mapping $F -> $NEW_F"
                cp -R "$F" "$NEW_F"
              fi
            done
            
            zip -q -1 -r "$GITHUB_WORKSPACE/templates/visionos.zip" .
            popd > /dev/null
            rm -rf /tmp/visionos_template
          fi

          for DIR_NAME in "${{ env.GODOT_VERSION }}.stable" "${{ env.GODOT_RELEASE_TAG }}"; do
            TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${DIR_NAME}"
            mkdir -p "$TEMPLATE_DIR"
            cp -r templates/* "$TEMPLATE_DIR/"
          done
          rm -rf templates templates.tpz

      - name: Export Apple Vision Pro Project
        run: |
          mkdir -p godot-spatial-workspace/builds/visionos
          cd godot-spatial-workspace
          godot --headless --import || true
          godot --headless --verbose --export-debug "Apple Vision Pro" builds/visionos/SpatialWorkspace.xcodeproj

      - name: Archive Xcode Project
        if: always()
        run: |
          mkdir -p godot-spatial-workspace/builds/visionos
          cd godot-spatial-workspace/builds
          if [ -d "visionos/SpatialWorkspace.xcodeproj" ]; then
            tar -czf SpatialWorkspace-visionOS-Xcode.tar.gz -C visionos SpatialWorkspace.xcodeproj
          else
            tar -czf SpatialWorkspace-visionOS-Xcode.tar.gz visionos
          fi

      - name: Upload visionOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visionos-xcode-project
          path: |
            godot-spatial-workspace/builds/SpatialWorkspace-visionOS-Xcode.tar.gz
            godot-spatial-workspace/builds/visionos/SpatialWorkspace.xcodeproj
          if-no-files-found: warn
          retention-days: 14

  # =========================================================================
  # 4. Public GitHub Release (latest & version tags)
  # =========================================================================
  publish-release:
    name: Publish Public XR Release (latest / version)
    runs-on: ubuntu-latest
    needs: [build-pico, build-quest, build-visionos]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-pico.result == 'success' || needs.build-quest.result == 'success' || needs.build-visionos.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          echo "=== Collected Artifacts ==="
          ls -la release-artifacts

          # Copy APK and tar.gz binaries into release-files
          find release-artifacts -type f \( -name "*.apk" -o -name "*.tar.gz" \) -exec cp -v {} release-files/ \;

          cd release-files
          if [ -n "$(ls -A .)" ]; then
            sha256sum * > SHA256SUMS.txt
          fi
          echo "=== Final Release Files ==="
          ls -la .

      - name: Create or Update Public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '"version":' package.json | head -1 | awk -F'"' '{print $4}')
          VERSION="${VERSION:-0.1.0}"

          # Determine target tag:
          # 1. Manual input from workflow_dispatch (if provided)
          # 2. Git tag from push (if refs/tags/*)
          # 3. Default to 'latest'
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="latest"
            fi
          fi

          echo "Target tag: $TAG"
          echo "Project version: $VERSION"

          TITLE="Spatial Workspace Native XR (v${VERSION})"
          if [ "$TAG" = "latest" ]; then
            TITLE="Spatial Workspace Native XR (latest - v${VERSION})"
          fi

          cat << 'EOF' > release_notes.md
          ## Spatial Workspace Native XR — Public Release

          Native standalone builds compiled with **Godot 4.7.2** for Apple Vision Pro, PICO 4 Ultra, and Meta Quest.

          ### 📦 Download Packages
          | Platform | Package / Runtime | Public Download |
          | :--- | :--- | :--- |
          | **PICO 4 Ultra** | Android APK (arm64 OpenXR) | [⬇️ SpatialWorkspace-Pico4Ultra.apk](https://github.com/${{ github.repository }}/releases/download/latest/SpatialWorkspace-Pico4Ultra.apk) |
          | **Meta Quest 2 / 3 / 3S / Pro** | Android APK (arm64 OpenXR) | [⬇️ SpatialWorkspace-MetaQuest.apk](https://github.com/${{ github.repository }}/releases/download/latest/SpatialWorkspace-MetaQuest.apk) |
          | **Apple Vision Pro** | Xcode Project (RealityKit / visionOS) | [⬇️ SpatialWorkspace-visionOS-Xcode.tar.gz](https://github.com/${{ github.repository }}/releases/download/latest/SpatialWorkspace-visionOS-Xcode.tar.gz) |

          ### 📲 Installation
          - **PICO 4 Ultra & Meta Quest**: Install directly via adb or SideQuest:
            ```bash
            adb install -r SpatialWorkspace-Pico4Ultra.apk
            # or
            adb install -r SpatialWorkspace-MetaQuest.apk
            ```
          - **Apple Vision Pro**: Extract `SpatialWorkspace-visionOS-Xcode.tar.gz`, open `SpatialWorkspace.xcodeproj` in Xcode 16+, select your Development Team under *Signing & Capabilities*, and run to your Vision Pro device or Simulator.

          ---
          *Automated build from commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on branch `${{ github.ref_name }}`.*
          EOF

          # Check if release already exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release '$TAG' already exists. Updating release metadata and uploading assets..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --target "${{ github.sha }}"
            gh release upload "$TAG" release-files/* --clobber
          else
            echo "Creating new release '$TAG'..."
            gh release create "$TAG" release-files/* \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --latest
          fi

          # If this was a versioned tag (e.g. v0.1.0), also synchronize the 'latest' release tag
          if [ "$TAG" != "latest" ]; then
            echo "Synchronizing rolling 'latest' release..."
            if gh release view "latest" > /dev/null 2>&1; then
              gh release edit "latest" --title "Spatial Workspace Native XR (latest - $TAG)" --notes-file release_notes.md --target "${{ github.sha }}"
              gh release upload "latest" release-files/* --clobber
            else
              gh release create "latest" release-files/* \
                --title "Spatial Workspace Native XR (latest - $TAG)" \
                --notes-file release_notes.md \
                --target "${{ github.sha }}" \
                --latest
            fi
          fi

          echo "Public release published successfully."
